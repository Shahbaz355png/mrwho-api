# Mr.Who API — single Render web service: Express API + the production
# frontend build, one process, one port, one domain (see DEPLOY.md).
# Mirrors the deploy pattern of the previous official server
# (~/workspace/xsolution-server-official/render.yaml).
# Secret values are NEVER written here — `sync: false` means "the owner
# pastes the value into the Render dashboard by hand".
services:
  - type: web
    name: mrwho-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # The DB layer uses Node's built-in node:sqlite — needs a modern
      # Node (Render otherwise defaults to an older one).
      - key: NODE_VERSION
        value: "24"
      # Folder (inside this repo) holding the production frontend build;
      # the server serves it at "/" and the API under "/api" on the
      # same port. Build it and copy it in before deploying — DEPLOY.md.
      - key: FRONTEND_DIST
        value: frontend-dist
      - key: JWT_SECRET
        generateValue: true
      # Public identifier for the "mr who api" Meta app — not a secret,
      # but kept as a dashboard value so this file holds names only.
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WA_SYSTEM_TOKEN
        sync: false
      # Reference IDs from the Meta console (tooling/docs; the backend
      # reads IDs per account row, so these are optional).
      - key: PHONE_NUMBER_ID
        sync: false
      - key: WABA_ID
        sync: false
